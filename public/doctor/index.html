<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e-Prescription — Doctor</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/shared/style.css" />
  <link rel="stylesheet" href="/doctor/doctor.css" />
  <script src="/vendor/socket.io.min.js"></script>
  <script src="/vendor/signature_pad.umd.min.js"></script>
  <script type="module" src="/shared/auth.js"></script>
</head>
<body class="locked" data-role="doctor">
  <header class="topbar">
    <h1>Doctor</h1>
    <span id="session-label" class="session-label"></span>
    <span id="conn" class="conn" role="status">Connecting…</span>
    <!-- Full-width strips under the top bar; they stack. -->
    <div class="topbar__strips">
      <p id="offline-banner" class="offline-banner" role="alert" hidden>
        Reconnecting to the pharmacy PC… A prescription you send now waits here and goes by itself when the connection is back.
      </p>
    </div>
  </header>

  <main>
    <p id="loading" class="muted">Loading…</p>
    <p id="load-error" class="msg msg--error" role="alert" hidden></p>

    <section id="no-session" class="start card" hidden>
      <p id="ended-note" class="ended-note" hidden></p>
      <p class="lead">No session is open.</p>
      <button id="start-session" type="button" class="btn btn--primary btn--xl">Start Session</button>
      <p id="start-error" class="msg msg--error" role="alert"></p>
    </section>

    <section id="session" hidden>
      <form id="rx-form" class="card" novalidate autocomplete="off">
        <label class="field-label" for="patient-ref">Patient ID or token</label>
        <input id="patient-ref" class="input input--patient" name="patientRef"
               maxlength="40" aria-required="true" autocapitalize="characters"
               spellcheck="false" />

        <fieldset class="mode" aria-label="How to write this prescription">
          <label class="mode__option"><input type="radio" name="mode" value="typed" checked /> <span>Typed</span></label>
          <label class="mode__option"><input type="radio" name="mode" value="handwritten" /> <span>Handwrite</span></label>
        </fieldset>

        <fieldset id="typed-fields" class="lines">
          <legend class="field-label">Medicines</legend>
          <div class="line line--header" aria-hidden="true">
            <span>Medicine</span><span>Dosage</span><span>Instructions</span><span></span>
          </div>
          <div id="lines"></div>
          <button id="add-line" type="button" class="btn btn--secondary">+ Add line</button>
        </fieldset>

        <section id="handwrite-fields" class="handwrite" hidden>
          <div class="pad">
            <canvas id="pad" class="pad__canvas" aria-label="Handwriting area. Draw the prescription here."></canvas>
            <span class="pad__hint" aria-hidden="true">Write here</span>
            <div id="pad-locked" class="pad__locked" role="alert" hidden></div>
          </div>
          <div class="pad__tools">
            <button id="pad-undo" type="button" class="btn btn--secondary">Undo</button>
            <button id="pad-clear" type="button" class="btn btn--secondary">Clear</button>
          </div>
        </section>

        <div class="send-row">
          <button id="send" type="submit" class="btn btn--primary btn--xl">Send</button>
          <p id="send-status" class="msg" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="card">
        <h2>This session</h2>
        <p id="sent-empty" class="empty">Nothing sent yet.</p>
        <ol id="sent-list" class="sent-list"></ol>
      </section>
    </section>
  </main>
</body>
</html>
